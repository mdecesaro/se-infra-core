
---
# K3s installation
k3s_install_channel: stable
k3s_version: ""

# Node configuration
k3s_node_name: "{{ ansible_facts['hostname'] }}"

# K3s configuration
k3s_config_dir: /etc/rancher/k3s
k3s_config_file: "{{ k3s_config_dir }}/config.yaml"

# Kubeconfig permissions
k3s_kubeconfig_mode: "0600"

# Kubernetes networking
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Kubelet configuration
k3s_kubelet_config_dir: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
k3s_kubelet_swap_config: "{{ k3s_kubelet_config_dir }}/99-swap.conf"