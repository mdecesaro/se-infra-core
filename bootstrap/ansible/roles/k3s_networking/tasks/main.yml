
---
- name: Inspect loaded kernel modules
  ansible.builtin.command: lsmod
  register: loaded_modules
  changed_when: false

- name: Load br_netfilter kernel module
  ansible.builtin.command: modprobe br_netfilter
  when: "'br_netfilter' not in loaded_modules.stdout"
  changed_when: true

- name: Persist br_netfilter kernel module loading
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Persist bridge networking sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k3s-networking.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
    owner: root
    group: root
    mode: "0644"

- name: Apply bridge networking sysctl parameters
  ansible.builtin.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-k3s-networking.conf
    reload: true
    state: present
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
