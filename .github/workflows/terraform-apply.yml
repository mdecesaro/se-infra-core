
name: "Terraform Infrastructure"

on:
  workflow_dispatch:

jobs:
  terraform:
    name: "Terraform Plan"
    runs-on: [self-hosted, pi-cluster]

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_S3_ALLOW_BIN_PROCESS: "true"
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      TF_VAR_minio_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_minio_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Plan
        run: terraform plan
